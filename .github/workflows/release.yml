name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, for example v0.1.0
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve and verify version
        id: version
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = if ($env:INPUT_TAG) { $env:INPUT_TAG } else { $env:REF_NAME }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne "v$version") {
            throw "Tag $tag does not match package.json version $version."
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Check release metadata and frontend
        run: pnpm release:check

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Lint Rust
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test Rust
        working-directory: src-tauri
        run: cargo test --locked --all-features

      - name: Build Windows bundle
        run: pnpm desktop:bundle:windows

      - name: Collect artifacts and checksums
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Path release-artifacts | Out-Null
          $setup = "src-tauri/target/release/bundle/nsis/LitheMark_${env:VERSION}_x64-setup.exe"
          if (-not (Test-Path $setup)) { throw "Missing NSIS bundle at $setup." }
          Copy-Item $setup "release-artifacts/LitheMark_${env:VERSION}_x64-setup.exe"
          Copy-Item "src-tauri/target/release/lithemark.exe" "release-artifacts/LitheMark_${env:VERSION}_x64.exe"
          Get-ChildItem release-artifacts -File |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Out-File -FilePath release-artifacts/SHA256SUMS.txt -Encoding utf8

      - name: Generate release notes
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/release-notes.ts $env:VERSION > release-artifacts/RELEASE_NOTES.md

      - uses: actions/upload-artifact@v4
        with:
          name: lithemark-windows-x64
          path: release-artifacts/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lithemark-windows-x64
          path: release-artifacts

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          {
            cat release-artifacts/RELEASE_NOTES.md
            echo
            echo "### Checksums (SHA-256)"
            echo
            echo '```'
            cat release-artifacts/SHA256SUMS.txt
            echo '```'
            echo
            echo "Windows builds are unsigned; verify the checksums before installing."
          } > notes.md
          rm release-artifacts/RELEASE_NOTES.md
          gh release create "$TAG" release-artifacts/* \
            --draft \
            --verify-tag \
            --title "LitheMark $VERSION" \
            --notes-file notes.md
